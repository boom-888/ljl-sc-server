services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ljl_sc
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  app:
    image: node:20
    working_dir: /app
    command: npx tsx watch src/index.ts
    ports:
      - "3001:3001"
    depends_on:
      - mysql
    environment:
      MYSQL_HOST: mysql
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: ljl_sc
      JWT_SECRET: vm-ljl-sc-secret-2026-safe
      NODE_ENV: development
    volumes:
      - ./src:/app/src
      - ./node_modules:/app/node_modules

volumes:
  mysql-data:
